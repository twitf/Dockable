# 基于 GitHub 官方 ".NET Core Desktop" 模板改造，已适配 Dockable 仓库真实结构：
#   - 单一项目 src/Dockable/Dockable.csproj（C# 12 + WPF，net10.0-windows10.0.22621.0，x64，unpackaged）
#   - 无测试项目、无 .wapproj / MSIX 打包、无代码签名证书
#   - 产物是仓库自带的 Portable 发布配置生成的单文件 Dockable.exe
#
# 2026-11 更新：所有 action 已升到声明 node24 的版本，消除
# "Node.js 20 is deprecated" 警告。
#   actions/checkout          v4(node20) -> v5(node24)
#   actions/setup-dotnet      v4(node20) -> v5(node24)
#   actions/upload-artifact   v4(node20) -> v6(node24)   ← 注意不是 v5，v5 仍声明 node20
#   actions/download-artifact v4(node20) -> v7(node24)   ← v5/v6 仍声明 node20
#   softprops/action-gh-release v2(node20) -> v3(node24)

name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    # 模板里的 matrix: [Debug, Release] 已去掉：Debug 产物没有分发价值，
    # 且会让耗时翻倍。Portable 发布配置内部已固定 Configuration=Release。
    runs-on: windows-latest

    env:
      Project_Path: src/Dockable/Dockable.csproj
      Publish_Profile: Portable
      Publish_Dir: src/Dockable/bin/Publish/Portable/win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 关键改动：csproj 的 TargetFramework 是 net10.0-windows10.0.22621.0，
      # 模板原来的 8.0.x 会直接报 SDK 版本不匹配。
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Show SDK info
        run: dotnet --info

      # 模板里的 "Setup MSBuild.exe"、"dotnet test" 已删：
      #   - dotnet CLI 足够还原/发布（CsWin32 源生成器走 NuGet，不需要 MSBuild 在 PATH）
      #   - 本仓库没有任何测试项目，dotnet test 会失败
      - name: Restore
        run: dotnet restore $env:Project_Path

      - name: Publish (Portable profile)
        run: dotnet publish $env:Project_Path -p:PublishProfile=$env:Publish_Profile

      - name: Verify output exe
        shell: pwsh
        run: |
          $exe = Join-Path $env:Publish_Dir 'Dockable.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Expected output was not produced: $exe" }
          Write-Host ("Built {0} ({1} MB)" -f $exe, [math]::Round((Get-Item -LiteralPath $exe).Length / 1MB, 1))

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:Publish_Dir/*" -DestinationPath "Dockable-win-x64.zip" -Force
          Write-Host ("Dockable-win-x64.zip ({0} MB)" -f [math]::Round((Get-Item 'Dockable-win-x64.zip').Length / 1MB, 1))

      # 模板里的 MSIX 上传已替换为单文件 exe + zip
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Dockable-win-x64
          path: |
            Dockable-win-x64.zip
            src/Dockable/bin/Publish/Portable/win-x64/Dockable.exe
          if-no-files-found: error

  # 模板没有这一段：打 v* 标签时自动建 Release，附上 zip 与单个 exe
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: Dockable-win-x64

      # upload-artifact 会保留各文件相对仓库根的最长公共前缀，所以 exe 落在嵌套目录里；
      # 这里先把它找出来复制到根目录，Release 才能直接挂一个 Dockable.exe。
      - name: Collect release assets
        run: |
          EXE="$(find . -type f -name 'Dockable.exe' | head -n 1)"
          if [ -z "$EXE" ]; then echo "Dockable.exe missing from the artifact"; exit 1; fi
          cp "$EXE" Dockable.exe
          ls -la Dockable.exe Dockable-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Dockable.exe
            Dockable-win-x64.zip
          generate_release_notes: true

  # 推 main 也发 Release：固定 tag `latest`，每次构建覆盖同名资产。
  # 下载地址永远不变，不用再去 Actions 页面手工下 exe：
  #   https://github.com/twitf/Dockable/releases/download/latest/Dockable.exe
  release-latest:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: Dockable-win-x64

      - name: Collect release assets
        run: |
          EXE="$(find . -type f -name 'Dockable.exe' | head -n 1)"
          if [ -z "$EXE" ]; then echo "Dockable.exe missing from the artifact"; exit 1; fi
          cp "$EXE" Dockable.exe
          ls -la Dockable.exe Dockable-win-x64.zip

      - name: Publish rolling release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          body: |
            自动发布的最新构建。

            提交：`${{ github.sha }}`
            说明：${{ github.event.head_commit.message }}
          files: |
            Dockable.exe
            Dockable-win-x64.zip
